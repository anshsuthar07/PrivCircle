name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: privcircle
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d privcircle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/privcircle
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/privcircle
      ROOM_TOKEN_SECRET: ci-room-token-secret-that-is-at-least-32-characters
      SESSION_PEPPER: ci-session-pepper-that-is-different-and-at-least-32-characters
      APP_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:1234
      REALTIME_PORT: "1234"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run unit and integration tests
        run: npm test
      - name: Build production application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser collaboration tests
        run: npm run test:e2e
