services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - private-share-redis:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: private_share
      POSTGRES_USER: private_share
      POSTGRES_PASSWORD: private_share
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U private_share -d private_share"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - private-share-postgres:/var/lib/postgresql/data

volumes:
  private-share-redis:
  private-share-postgres:
